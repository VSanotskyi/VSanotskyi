<svg xmlns="http://www.w3.org/2000/svg" width="920" height="268" viewBox="0 0 920 268" role="img" aria-labelledby="name description">
  <title id="name">Vasyl Sanotskyi | Full-stack development and LLM integrations</title>
  <desc id="description">Midnight-blue portfolio banner with a glowing request moving through a stylized neural network.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#101827"/><stop offset="1" stop-color="#09111b"/>
    </linearGradient>
    <linearGradient id="line" x1="575" y1="0" x2="876" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5d80e5" stop-opacity=".15"/><stop offset=".55" stop-color="#6387f5"/><stop offset="1" stop-color="#72e3c7"/>
    </linearGradient>
    <pattern id="grid" width="27" height="27" patternUnits="userSpaceOnUse">
      <path d="M27 0H0V27" fill="none" stroke="#587891" stroke-opacity=".14"/>
    </pattern>
    <radialGradient id="glow">
      <stop stop-color="#557de8" stop-opacity=".22"/><stop offset="1" stop-color="#557de8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="requestGlow"><stop stop-color="#8fffe0" stop-opacity=".8"/><stop offset="1" stop-color="#8fffe0" stop-opacity="0"/></radialGradient>
    <clipPath id="card"><rect x="1" y="1" width="918" height="266" rx="24"/></clipPath>
  </defs>
  <style>
    .request { animation: request 3.8s linear infinite; }
    .response { transform-box:fill-box; transform-origin:center; opacity:0; animation: response 3.8s ease-out infinite; }
    @keyframes request { 0%,9%,92%,100% {opacity:0} 15%,84% {opacity:1} }
    @keyframes response { 0%,80% {opacity:0;transform:scale(.8)} 87% {opacity:.8} 100% {opacity:0;transform:scale(2)} }
    @media (prefers-reduced-motion: reduce) { .request,.response { visibility:hidden; animation:none } }
  </style>
  <g clip-path="url(#card)">
    <rect x="1" y="1" width="918" height="266" fill="url(#bg)"/>
    <ellipse cx="770" cy="131" rx="306" ry="236" fill="url(#glow)"/>
    <path d="M550 20h366v228H550z" fill="url(#grid)"/>
    <path d="M32 39h12M38 33v12M872 228h12M878 222v12" stroke="#92abbf" stroke-opacity=".48"/>
    <path d="M50 215H870" stroke="#3b526d" stroke-opacity=".52"/>
    <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
      <text x="52" y="69" fill="#83e2cc" font-size="14" font-weight="650" letter-spacing="2.8">FULL-STACK DEVELOPER</text>
      <text x="50" y="133" fill="#f7faff" font-size="55" font-weight="730" letter-spacing="-2">Vasyl Sanotskyi</text>
      <text x="53" y="171" fill="#bac9e5" font-size="22">B2B SaaS and LLM integrations</text>
      <text x="52" y="244" fill="#a8bdd7" font-size="13" letter-spacing="1.5">REACT  /  NEXT.JS  /  NODE.JS  /  NESTJS  /  SQL &amp; NOSQL</text>
    </g>
    <g aria-hidden="true">
      <g fill="none" stroke="#5f7ba2" stroke-opacity=".43" stroke-width="1"><path d="M565 129L625 82"/><path d="M565 129L625 129"/><path d="M565 129L625 176"/><path d="M625 82L690 67"/><path d="M625 82L690 107"/><path d="M625 129L690 67"/><path d="M625 129L690 107"/><path d="M625 129L690 151"/><path d="M625 129L690 191"/><path d="M625 176L690 151"/><path d="M625 176L690 191"/><path d="M690 67L755 81"/><path d="M690 67L755 129"/><path d="M690 107L755 81"/><path d="M690 107L755 129"/><path d="M690 151L755 129"/><path d="M690 151L755 177"/><path d="M690 191L755 129"/><path d="M690 191L755 177"/><path d="M755 81L817 106"/><path d="M755 129L817 106"/><path d="M755 129L817 153"/><path d="M755 177L817 153"/><path d="M817 106L871 129"/><path d="M817 153L871 129"/></g>
      <path d="M565 129L625 82L690 107L755 177L817 153L871 129" fill="none" stroke="url(#line)" stroke-width="1.55" stroke-linejoin="round" opacity=".79"/>
      <g fill="#13263b" stroke="#759fcd" stroke-width="1.1"><circle cx="565" cy="129" r="5" /><circle cx="625" cy="82" r="3.5" /><circle cx="625" cy="129" r="3.5" /><circle cx="625" cy="176" r="3.5" /><circle cx="690" cy="67" r="3.5" /><circle cx="690" cy="107" r="3.5" /><circle cx="690" cy="151" r="3.5" /><circle cx="690" cy="191" r="3.5" /><circle cx="755" cy="81" r="3.5" /><circle cx="755" cy="129" r="3.5" /><circle cx="755" cy="177" r="3.5" /><circle cx="817" cy="106" r="3.5" /><circle cx="817" cy="153" r="3.5" /><circle cx="871" cy="129" r="5" /></g>
      <circle cx="565" cy="129" r="2.2" fill="#91f6db"/><circle cx="871" cy="129" r="2.2" fill="#91f6db"/>
      <circle class="request" r="11.5" fill="url(#requestGlow)"><animateMotion dur="3.8s" repeatCount="indefinite" path="M565 129L625 82L690 107L755 177L817 153L871 129" keyPoints="0;0;1;1" keyTimes="0;.12;.84;1" calcMode="linear"/></circle>
      <circle class="request" r="3.3" fill="#caffed"><animateMotion dur="3.8s" repeatCount="indefinite" path="M565 129L625 82L690 107L755 177L817 153L871 129" keyPoints="0;0;1;1" keyTimes="0;.12;.84;1" calcMode="linear"/></circle>
      <circle class="response" cx="871" cy="129" r="7" fill="none" stroke="#7be6cd"/>
      <g font-family="system-ui, sans-serif" font-weight="650" font-size="10" fill="#a8bdd7" letter-spacing="1.4"><text x="550" y="204">REQUEST</text><text x="870" y="204" text-anchor="end">RESPONSE</text></g>
    </g>
  </g>
  <rect x="1" y="1" width="918" height="266" rx="24" fill="none" stroke="#354765"/>
</svg>
