<svg xmlns="http://www.w3.org/2000/svg" width="920" height="164" viewBox="0 0 920 164" role="img" aria-labelledby="title desc">
<title id="title">Neon night drive</title><desc id="desc">A retro sports coupe drives past a palm-lined city at dusk.</desc>
<defs>
 <linearGradient id="night" x2="0" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#151235"/><stop offset=".72" stop-color="#3c2153"/><stop offset="1" stop-color="#ab455f"/></linearGradient>
 <linearGradient id="sun" x2="0" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#ffc175"/><stop offset="1" stop-color="#ff6ba0"/></linearGradient>
 <linearGradient id="paint"><stop stop-color="#991cb5"/><stop offset=".45" stop-color="#f36cbe"/><stop offset="1" stop-color="#fd8d9d"/></linearGradient>
 <linearGradient id="glass"><stop stop-color="#675884"/><stop offset="1" stop-color="#212438"/></linearGradient>
 <clipPath id="clip"><rect x="1" y="1" width="918" height="162" rx="18"/></clipPath>
 <path id="palm" d="M0 57Q5 28 0 0M0 1Q-13-8 -24 4M0 1Q-15 1 -18 12M0 1Q-5 -12 -15 -13M0 1Q6 -13 16 -13M0 1Q16 -8 26 2M0 1Q16 0 18 12" fill="none" stroke="#18132d" stroke-width="2.8" stroke-linecap="round"/>
 <pattern id="windows" width="12" height="8" patternUnits="userSpaceOnUse"><rect x="3" y="2" width="3" height="2" rx=".5" fill="#f7a981" opacity=".48"/></pattern>
</defs>
<style>
 .car { transform:translateX(380px); animation:drive 10s linear infinite; }
 .lane { animation:lane 1.7s linear infinite; }
 @keyframes drive { 0%{transform:translateX(-184px)} 100%{transform:translateX(930px)} }
 @keyframes lane { 0%{stroke-dashoffset:0} 100%{stroke-dashoffset:64} }
 @media (prefers-reduced-motion: reduce) { .car,.lane { animation:none } }
</style>
