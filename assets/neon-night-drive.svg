<svg xmlns="http://www.w3.org/2000/svg" width="920" height="240" viewBox="0 0 920 240" role="img" aria-labelledby="title desc">
<title id="title">After Hours</title>
<desc id="desc">A midnight-plum retro sports coupé on a neon-lit coastal road, seen from the rear at dusk.</desc>
<defs>
