 <linearGradient id="tail"><stop stop-color="#fa637c"/><stop offset=".55" stop-color="#ffb18e"/><stop offset="1" stop-color="#ff617f"/></linearGradient>
 <radialGradient id="under"><stop stop-color="#ed597c" stop-opacity=".32"/><stop offset="1" stop-color="#ed597c" stop-opacity="0"/></radialGradient>
 <clipPath id="frame"><rect x="1" y="1" width="918" height="238" rx="18"/></clipPath>
