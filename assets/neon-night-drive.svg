 <linearGradient id="body" x1="0" y1="0" x2=".7" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#f3a1b1"/><stop offset=".24" stop-color="#9b638c"/><stop offset=".52" stop-color="#452b57"/><stop offset="1" stop-color="#171528"/></linearGradient>
 <linearGradient id="flank" x1="0" y1="0" x2="1" y2=".8" gradientUnits="objectBoundingBox"><stop stop-color="#24203f"/><stop offset=".25" stop-color="#77416f"/><stop offset=".65" stop-color="#c979ab"/><stop offset=".84" stop-color="#534477"/><stop offset="1" stop-color="#201b42"/></linearGradient>
