name: generate github metrics

on:
  schedule:
    - cron: "0 1 * * *" 
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v3 # <--- ДОДАНО: тепер файл буде куди зберігати

      - name: generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: VSanotskyi
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Kyiv
          plugin_languages: yes
          plugin_languages_limit: 8
          use_prebuilt_image: yes
          filename: github-metrics.svg
          output_action: none

      - name: prepare metrics for deploy
        run: |
          mkdir -p dist_metrics
          # Якщо файл у корені, переміщуємо його
          mv github-metrics.svg dist_metrics/ 2>/dev/null || mv /github/workspace/github-metrics.svg dist_metrics/ || true

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist_metrics
          keep_history: true # Не видаляє змійку
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
