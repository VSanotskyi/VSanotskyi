name: generate github metrics

on:
  schedule:
    - cron: "0 1 * * *" # щодня о першій ночі (щоб не перетиналося зі змійкою)
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: VSanotskyi
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Kyiv
          
          # Плагін мов
          plugin_languages: yes
          plugin_languages_ignored: html, css, scss
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          
          # Налаштування виводу
          filename: github-metrics.svg
          output_action: none # ми самі заштовхаємо файл в гілку нижче

      - name: push metrics to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: .
          # Важливо вказати конкретний файл, щоб не затерти змійку
          fqdn: ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
