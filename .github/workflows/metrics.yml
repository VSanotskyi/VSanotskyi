name: generate github metrics

on:
  schedule:
    - cron: "0 1 * * *" # Щодня о 01:00
  workflow_dispatch: # Дозволяє запускати вручну
  push:
    branches:
      - main

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: VSanotskyi
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Kyiv
          
          # Налаштування плагіна мов
          plugin_languages: yes
          plugin_languages_ignored: html, css, scss
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          
          # Використовуємо готовий образ, щоб не було помилок Docker
          use_prebuilt_image: yes
          
          filename: github-metrics.svg
          output_action: none # ми самі завантажимо файл нижче

      - name: push metrics to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: .
          # Це важливо, щоб не видаляти файли змійки, які вже там є
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
