name: Update top languages

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate languages.svg
        env:
          GH_TOKEN: ${{ secrets.LANGS_PAT || github.token }}
          INCLUDE_PRIVATE: ${{ secrets.LANGS_PAT != '' }}
        run: |
          bash scripts/update-top-langs.sh
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/languages.svg
          git diff --staged --quiet || git commit -m "chore: refresh top languages"
          git push
