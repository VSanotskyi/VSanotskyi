name: Update top languages

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate top-langs.svg
        env:
          GH_TOKEN: ${{ secrets.LANGS_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Add repo secret LANGS_PAT (classic PAT with repo scope) to include private repos."
            exit 1
          fi
          chmod +x scripts/update-top-langs.sh
          ./scripts/update-top-langs.sh
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/top-langs.svg
          git diff --staged --quiet || git commit -m "chore: refresh top languages (public + private)"
          git push
