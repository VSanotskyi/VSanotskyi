name: generate assets

on:
  schedule:
    - cron: "0 */24 * * *" 
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      # 1. Генерація змійки (твій існуючий код)
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
          
      # 2. Генерація основної статистики (Metrics)
      - name: generate github-metrics.svg
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: VSanotskyi
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Kyiv
          filename: github-metrics.svg
          output_action: none # ми самі завантажимо файл нижче
          
          # Налаштування плагінів (Top Languages + Streak)
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          
      # Переміщуємо згенерований файл metrics у папку dist до змійки
      - name: move metrics to dist
        run: |
          mkdir -p dist
          mv /github/workspace/github-metrics.svg dist/

      # 3. Пуш усіх файлів у гілку output
      - name: push assets to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
